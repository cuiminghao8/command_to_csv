[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd2csv"
version = "0.2.0"
description = "Run commands on network devices, parse the output, export CSV/JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Minghao Cui", email = "cuiminghao8@gmail.com" }]
keywords = ["network", "automation", "pyats", "genie", "netmiko", "csv"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = [
  "pyats>=23.0",
  "genie>=23.0",
  "ntc-templates>=4.0",
  "textfsm>=1.1",
  "pyyaml>=6.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.scripts]
cmd2csv = "cmd2csv.cli:main"

[project.urls]
Homepage = "https://github.com/cuiminghao8/command_to_csv"
Repository = "https://github.com/cuiminghao8/command_to_csv"

[tool.setuptools]
packages = ["cmd2csv"]

[tool.setuptools.package-data]
cmd2csv = ["templates/*.textfsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
